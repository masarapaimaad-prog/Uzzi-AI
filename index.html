

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>UZZI AI | Your AI. Your Rules.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090909;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 14px;
}

header {
  text-align: center;
  padding: 15px 0;
}

.logo {
  color: #d4af37;
  font-size: 43px;
  font-weight: 900;
  letter-spacing: 7px;
  margin: 5px;
  text-shadow: 0 0 20px #d4af3766;
}

.tagline {
  color: #c5a85a;
  letter-spacing: 2px;
  font-size: 12px;
}

.robot {
  width: 165px;
  height: 145px;
  margin: 38px auto 25px;
  border: 2px solid #d4af37;
  border-radius: 42px;
  background: linear-gradient(145deg,#292929,#080808);
  box-shadow: 0 0 35px #d4af3740;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.antenna {
  position: absolute;
  width: 4px;
  height: 25px;
  background: #d4af37;
  top: -25px;
}

.antenna::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  background: #d4af37;
  border-radius: 50%;
  top: -8px;
  left: -4px;
  box-shadow: 0 0 15px #d4af37;
}

.eyes {
  display: flex;
  gap: 35px;
}

.eye {
  width: 19px;
  height: 25px;
  border-radius: 50%;
  background: #e9c75b;
  box-shadow: 0 0 18px #d4af37;
  animation: blink 4s infinite;
}

.mouth {
  width: 42px;
  height: 13px;
  border-bottom: 4px solid #d4af37;
  border-radius: 50%;
  margin-top: 20px;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(.1); }
}

.status {
  text-align: center;
  color: #c5a85a;
  font-size: 12px;
  margin-bottom: 18px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #d4af37;
  border-radius: 50%;
  margin-right: 6px;
}

.chat {
  max-width: 520px;
  margin: auto;
  border: 1px solid #8f7426;
  border-radius: 20px;
  padding: 17px;
  background: #111;
  box-shadow: 0 0 30px #d4af3715;
}

.chat h2 {
  text-align: center;
  color: #d4af37;
}

#messages {
  height: 320px;
  overflow-y: auto;
  background: #080808;
  padding: 12px;
  border-radius: 12px;
  margin: 15px 0;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  background: #252525;
  border-left: 3px solid #888;
}

.uzzi {
  background: #211b0c;
  border-left: 3px solid #d4af37;
}

form {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #202020;
  border: 1px solid #555;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}

button {
  background: #d4af37;
  color: #090909;
  border: none;
  border-radius: 10px;
  padding: 12px 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

.small-button {
  background: transparent;
  color: #d4af37;
  border: 1px solid #5d4b1d;
  padding: 8px 12px;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin: 25px;
}
</style>
</head>

<body>

<header>
  <h1 class="logo">UZZI AI</h1>
  <p class="tagline">YOUR AI. YOUR RULES.</p>
</header>

<div class="robot">
  <div class="antenna"></div>
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
  <div class="mouth"></div>
</div>

<div class="status">
  <span class="dot"></span>
  READY TO CHAT
</div>

<main class="chat">
  <h2>Welcome to UZZI 😂</h2>

  <div id="messages" aria-live="polite">
    <div class="message uzzi">
      UZZI: Yo! I'm UZZI. Ask me anything. Let's get clever! 😂
    </div>
  </div>

  <form id="form">
    <input
      id="question"
      type="text"
      placeholder="Talk to UZZI..."
      maxlength="4000"
      autocomplete="off"
      required
    >
    <button id="send" type="submit">SEND</button>
  </form>

  <div class="actions">
    <button class="small-button" id="clear" type="button">
      Clear chat
    </button>
    <span style="color:#777;font-size:11px;align-self:center">
      UZZI 2.0
    </span>
  </div>
</main>

<footer>
  UZZI AI · Built for the future 🖤💛
</footer>

<script>
const form = document.getElementById("form");
const input = document.getElementById("question");
const messagesBox = document.getElementById("messages");
const send = document.getElementById("send");
const clear = document.getElementById("clear");

let conversation = [];

function showMessage(name, message, type) {
  const element = document.createElement("div");
  element.className = "message " + type;
  element.textContent = name + ": " + message;
  messagesBox.appendChild(element);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const question = input.value.trim();

  if (!question || send.disabled) return;

  conversation.push({
    role: "user",
    content: question
  });

  showMessage("YOU", question, "user");
  input.value = "";
  send.disabled = true;
  send.textContent = "...";

  const loading = document.createElement("div");
  loading.className = "message uzzi";
  loading.textContent = "UZZI is thinking... 🤔";
  messagesBox.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: conversation.slice(-12)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI connection problem.");
    }

    if (typeof data.reply !== "string") {
      throw new Error("UZZI returned an invalid reply.");
    }

    conversation.push({
      role: "boss",
      content: data.reply
    });

    loading.remove();
    showMessage("UZZI", data.reply, "uzzi");

  } catch (error) {
    loading.textContent = "UZZI: " + error.message;
  } finally {
    send.disabled = false;
    send.textContent = "SEND";
    input.focus();
  }
});

clear.addEventListener("click", () => {
  conversation = [];
  messagesBox.innerHTML = "";
  showMessage("UZZI", "Fresh start! What are we doing? 😂", "uzzi");
});
</script>

</body>
</html>
